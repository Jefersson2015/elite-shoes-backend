spring.application.name=elite-backend

# Configuración de la Base de Datos en la Nube (TiDB Cloud)
# Nota: Cambia 'test' por el nombre real de tu base de datos si es diferente
spring.datasource.url=jdbc:mysql://gateway01.us-east-1.prod.aws.tidbcloud.com:4000/test?useSSL=true&requireSSL=true
spring.datasource.username=3sJNV1y6M9UGW37.root
spring.datasource.password=DOrcuONt8xqzvnbv
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuración de JPA / Hibernate
# 'validate' asegura que Hibernate verifique que las tablas existen, pero no las borra ni modifica
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Configuración del servidor (Render asignará su propio puerto, pero 8080 es el default)
server.port=8080

# Configuración de subida de archivos (imágenes)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB